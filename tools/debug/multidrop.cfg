# Two standalone Core2350B boards sharing SWCLK, SWDIO and GND.
# Boot blink images with ICE_SWD_INSTANCE_ID=1 and =2 before connecting.
# Minimal Arm-only attach configuration: no flash driver, rescue, or global
# reset hooks. Keep operations addressed to the selected physical board.
bindto 127.0.0.1
gdb port 3333
tcl port disabled
telnet port disabled
source [find interface/cmsis-dap.cfg]
adapter speed 1000
if {[info exists ::env(DEBUG_PROBE_SERIAL)] && $::env(DEBUG_PROBE_SERIAL) ne ""} {
    adapter serial $::env(DEBUG_PROBE_SERIAL)
}
transport select swd
source [find target/swj-dp.tcl]

foreach instance {1 2} {
    set chip board$instance
    swj_newdap $chip cpu -expected-id 0x00040927
    dap create $chip.dap -adiv6 -chain-position $chip.cpu \
        -dp-id 0x00040927 -instance-id $instance
    foreach core {0 1} ap {0x2000 0x4000} {
        target create $chip.cm$core cortex_m -dap $chip.dap -ap-num $ap
        if {$core == 0} {
            $chip.cm$core configure -gdb-port [expr {3332 + $instance}]
        } else {
            $chip.cm$core configure -gdb-port disabled
        }
        $chip.cm$core cortex_m reset_config sysresetreq
        $chip.cm$core configure -rtos hwthread
    }
    # Halt/resume both cores of one chip together, independently of its partner.
    target smp $chip.cm0 $chip.cm1
}
targets board1.cm0
