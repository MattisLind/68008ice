# Host bridge: GDB is the only exposed service. On macOS Docker Desktop can
# reach the host's loopback listener via host.docker.internal.
bindto 127.0.0.1
gdb port 3333
tcl port disabled
telnet port disabled
source [find interface/cmsis-dap.cfg]
adapter speed 1000
if {[info exists ::env(DEBUG_PROBE_SERIAL)] && $::env(DEBUG_PROBE_SERIAL) ne ""} {
    adapter serial $::env(DEBUG_PROBE_SERIAL)
}
source [find target/rp2350.cfg]
